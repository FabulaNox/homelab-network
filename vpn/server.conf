# OpenVPN server - the lab's single inbound path. The edge firewall forwards
# exactly this one UDP port; once on the tunnel you are on the LAN.
port 61123
proto udp
dev tun

# PKI: a dedicated VPN CA (own CA, own CRL) for client identity, but the SERVER
# cert is the same Let's Encrypt wildcard the reverse proxy renews - re-extracted
# by a systemd path watcher on every renewal (see ../certs/). Clients embed the
# CA chain, not the server cert, so renewals never force a client re-issue.
ca vpn-ca.crt
crl-verify vpn-crl.pem
cert le-server.crt
key le-server.key
dh dh.pem

# Address pool + what to push to clients.
server 198.51.100.0 255.255.255.0
ifconfig-pool-persist ipp.txt
push "route 192.0.2.0 255.255.255.0"        # reach the management LAN
push "dhcp-option DNS 192.0.2.1"             # DNS via the router, which fronts
                                             # the core resolver + DoH failover

keepalive 5 60
float
tls-auth ta.key 0
cipher AES-256-GCM
auth SHA256

# Drop privileges and survive restarts/roaming.
user nobody
group nogroup
persist-key
persist-tun
explicit-exit-notify 1

status openvpn-status.log
verb 3
log-append /var/log/openvpn/openvpn.log
