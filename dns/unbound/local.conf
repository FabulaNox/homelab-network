server:
    # Bind 0.0.0.0 so LAN, VPN, and container clients all resolve here. The host
    # itself points /etc/resolv.conf at the loopback alias 127.0.0.10 (see the
    # net-topology setup in homelab-docker-platform) - a 0.0.0.0 listener answers
    # on that alias too, so host resolution survives any NIC/link change.
    interface: 0.0.0.0
    port: 53

    # Only the trusted segments may query the resolver.
    access-control: 127.0.0.0/8       allow   # localhost + loopback aliases
    access-control: 192.0.2.0/24      allow   # management LAN
    access-control: 198.51.100.0/24   allow   # VPN clients
    access-control: 203.0.113.0/24    allow   # per-tier docker bridges
    access-control: 0.0.0.0/0         refuse  # everything else

    # Privacy / hygiene.
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
