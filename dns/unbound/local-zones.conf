server:
    # ---------------------------------------------------------------------------
    # Split-horizon: internal names resolve to the core server's LAN address.
    # The same hostnames work on-LAN and over VPN, and never point anywhere
    # public. Add a line per service; the wildcard cert (*.example.com) covers
    # them all, so a new internal service needs only a local-data row here.
    # ---------------------------------------------------------------------------
    local-zone: "example.com." static
    local-data: "gitlab.example.com.     A 192.0.2.10"
    local-data: "wazuh.example.com.      A 192.0.2.10"
    local-data: "traefik.example.com.    A 192.0.2.10"
    local-data: "dns.example.com.        A 192.0.2.10"
    local-data: "vpn.example.com.        A 192.0.2.10"
    local-data: "mirror.example.com.     A 192.0.2.10"
    local-data: "www.example.com.        A 192.0.2.10"

    # ---------------------------------------------------------------------------
    # Detection-driven blocklisting. A SIEM finding showed several internal
    # hosts following PTR (reverse-DNS) delegations out to an unfamiliar
    # nameserver while resolving routine traffic. The resolver should never walk
    # that referral, so the delegating reverse zones - and the forward name they
    # point at - are pinned to NXDOMAIN. This is hardening that came straight out
    # of a triaged alert, not a guess. (Ranges below use documentation prefixes.)
    # ---------------------------------------------------------------------------
    local-zone: "2.0.192.in-addr.arpa."    always_nxdomain   # reverse of an abused range
    local-zone: "100.51.198.in-addr.arpa." always_nxdomain
    local-zone: "referral-target.example." always_nxdomain   # the forward name itself
